<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — Schichtfix</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--em:#f5831f;--ink:#f3f7ff;--body:#c3d0e8;--muted:#8a9bbe;--bg:#0f1c36;--panel:#1b2c4e;--line:#2d3d60}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,Segoe UI,sans-serif;color:var(--body);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,28,54,.9);backdrop-filter:blur(10px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Manrope';font-weight:800;font-size:20px;color:var(--ink);text-decoration:none}
.logo b{color:var(--em)}
.back{color:var(--em);text-decoration:none;font-weight:600;font-size:14px}
main{padding:54px 0 70px}
h1{font-family:'Manrope';color:var(--ink);font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:34px}
h2{font-family:'Manrope';color:var(--ink);font-size:20px;font-weight:700;margin:30px 0 10px}
p{margin-bottom:12px;font-size:15.5px}
strong{color:var(--ink)}
a{color:var(--em)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:8px 0 18px}
.card p{margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:40px;padding-top:18px}
.ph{color:var(--em);font-weight:600}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
footer a{color:var(--muted)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-block;font-family:'Manrope';font-weight:800;padding:13px 24px;border-radius:100px;text-decoration:none}.p{background:#f5831f;color:#04140f}.g{border:1px solid var(--line);color:var(--ink)}
</style>
</head>
<body>
<header><div class="wrap nav"><a href="/" class="logo">Schicht<b>fix</b></a><a href="/" class="back">← Zur Startseite</a></div></header>
<main><div class="wrap">
  <h1>Seite nicht gefunden</h1>
  <p class="sub">Fehler 404 · Diese Seite gibt es nicht (mehr).</p>
  <p>Suchen Sie Personal für Lager, Produktion oder Logistik im Ruhrgebiet? Oder suchen Sie einen Job?</p>
  <div class="btns"><a class="btn p" href="/#anfrage">Personal anfragen</a><a class="btn g" href="/jobs.html">Jobs für Bewerber</a><a class="btn g" href="/">Zur Startseite</a></div>
</div></main>
<footer><div class="wrap"><a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a> · © 2026 Schichtfix</div></footer>
</body></html>
